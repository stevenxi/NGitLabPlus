version: 2.0.{build}
branches:
  only:
  - NGitLabPlus
  - master
  - release-of-fork
image: Visual Studio 2017
configuration: Release
init:
  - echo NGitLabPlus repository appveyor.yml loaded
assembly_info:
  patch: true
  file: '**\AssemblyInfo.*'
  assembly_version: '{version}'
  assembly_file_version: '{version}'
  assembly_informational_version: '{version}'
before_build:
  - nuget restore NGitLab\NGitLab.Tests\packages.config -PackagesDirectory NGitLab\packages -NonInteractive
  - nuget restore NGitLab\NGitLabPlus.sln
dotnet_csproj:
  patch: true
  file: '**\*.csproj'
  version: '{version}'
  package_version: '{version}'
  assembly_version: '{version}'
  file_version: '{version}'
  informational_version: '{version}'
build:
  project: NGitLab\NGitLabPlus.sln
  verbosity: minimal
test: off
artifacts:
- path: NGitLab\NGitLab\bin\Release\NGitLab.Plus-UDIntel*.nupkg
  name: NGitLab.Plus-UDIntel
deploy:
- provider: NuGet
  api_key:
    secure: PU0bPRkO2aQof2bCGjqULQbq3cu/ypakQxsPQrbKTH9p/QMMmMmk5hPD+sGhIKcz
  on:
    branch: /release-of-fork/